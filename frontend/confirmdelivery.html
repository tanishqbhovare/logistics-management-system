<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delivery - DeliverEase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .delivery-card {
            transition: transform 0.2s;
        }
        .delivery-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center space-x-2">
                <div class="bg-black rounded-md p-1.5">
                    <i class="fas fa-archive text-white text-base"></i>
                </div>
                <span class="font-semibold text-xl text-black">DeliverEase</span>
            </div>
            <a href="index.html" class="text-gray-600 hover:text-gray-900">
                <i class="fas fa-home"></i> Home
            </a>
        </div>

        <h1 class="text-2xl font-bold mb-6 text-gray-800">Active Deliveries</h1>
        
        <div id="deliveriesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Delivery cards will be inserted here -->
        </div>

        <div id="noDeliveries" class="hidden text-center py-12">
            <i class="fas fa-truck-loading text-4xl text-gray-400 mb-4"></i>
            <p class="text-gray-600">No active deliveries found</p>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl transform transition-all duration-300">
            <h3 class="text-lg font-bold text-gray-900 mb-2">Confirm Delivery</h3>
            <p class="text-gray-600 mb-6">Are you sure you want to confirm this delivery?</p>
            <div class="flex justify-end space-x-3">
                <button id="cancelConfirmBtn" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition text-sm font-medium">Cancel</button>
                <button id="submitConfirmBtn" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition text-sm font-medium">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Custom Success Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Delivery confirmed successfully!</span>
    </div>

    <script>
        const API_BASE_URL = "https://logistics-management-system-dk0t.onrender.com";

        async function loadDeliveries() {
            try {
                const response = await fetch(`${API_BASE_URL}/all_deliveries`);
                if (!response.ok) {
                    throw new Error('Failed to fetch deliveries');
                }
                const data = await response.json();
                displayDeliveries(data.deliveries);
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to load deliveries', true);
            }
        }

        function displayDeliveries(deliveries) {
            const deliveriesList = document.getElementById('deliveriesList');
            const noDeliveries = document.getElementById('noDeliveries');

            if (!deliveries || deliveries.length === 0) {
                deliveriesList.classList.add('hidden');
                noDeliveries.classList.remove('hidden');
                return;
            }

            deliveriesList.innerHTML = deliveries.map(delivery => `
                <div class="delivery-card bg-white rounded-lg shadow-md p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="font-bold text-lg text-gray-800">Delivery #${delivery.delivery_id}</h3>
                            <p class="text-sm text-gray-500">Started: ${delivery.delivery_start || 'N/A'}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-sm font-medium 
                            ${delivery.status === 'Completed' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                            ${delivery.status}
                        </span>
                    </div>
                    
                    <div class="space-y-2 mb-4">
                        <p class="text-gray-600">
                            <i class="fas fa-map-marker-alt text-red-500 mr-2"></i>
                            From: ${delivery.origin}
                        </p>
                        <p class="text-gray-600">
                            <i class="fas fa-flag-checkered text-green-500 mr-2"></i>
                            To: ${delivery.destination}
                        </p>
                        <p class="text-gray-600">
                            <i class="fas fa-user text-blue-500 mr-2"></i>
                            Driver: ${delivery.driver_name}
                        </p>
                        <p class="text-gray-600">
                            <i class="fas fa-truck text-purple-500 mr-2"></i>
                            Truck: ${delivery.truck_number}
                        </p>
                    </div>

                    ${delivery.status !== 'Completed' ? `
                        <button id="confirmBtn-${delivery.delivery_id}" onclick="showConfirmModal(${delivery.delivery_id})" 
                                class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition">
                            <i class="fas fa-check mr-2"></i>Confirm Delivery
                        </button>
                    ` : `
                        <button disabled class="w-full bg-gray-300 text-gray-600 py-2 rounded-md cursor-not-allowed">
                            <i class="fas fa-check mr-2"></i>Delivery Completed
                        </button>
                    `}
                </div>
            `).join('');

            deliveriesList.classList.remove('hidden');
            noDeliveries.classList.add('hidden');
        }

        let deliveryIdToConfirm = null;

        function showConfirmModal(deliveryId) {
            deliveryIdToConfirm = deliveryId;
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('hidden');
        }

        function hideConfirmModal() {
            const modal = document.getElementById('confirmModal');
            modal.classList.add('hidden');
            deliveryIdToConfirm = null;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            if (isError) {
                toast.classList.remove('bg-green-600');
                toast.classList.add('bg-red-600');
            } else {
                toast.classList.remove('bg-red-600');
                toast.classList.add('bg-green-600');
            }
            
            // Show toast
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            // Hide after 3 seconds
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Setup custom event handlers
        document.addEventListener('DOMContentLoaded', () => {
            loadDeliveries();
            
            document.getElementById('cancelConfirmBtn').addEventListener('click', hideConfirmModal);
            document.getElementById('submitConfirmBtn').addEventListener('click', async () => {
                if (!deliveryIdToConfirm) return;
                const deliveryId = deliveryIdToConfirm;
                hideConfirmModal();
                
                try {
                    const response = await fetch(`${API_BASE_URL}/confirm_delivery`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ delivery_id: deliveryId })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to confirm delivery');
                    }

                    showToast('Delivery confirmed successfully!');
                    loadDeliveries(); // Refresh the list
                } catch (error) {
                    console.error('Error:', error);
                    showToast('Failed to confirm delivery', true);
                }
            });
        });
    </script>
</body>
</html>
